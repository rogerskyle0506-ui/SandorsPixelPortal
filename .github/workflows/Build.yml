name: Build Sandors Mirrorcast Apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for Gradle wrappers
      run: |
        chmod +x android/SandorsReceiver/gradlew
        chmod +x android/SandorsSender/gradlew

    - name: Build Fire Stick Receiver APK (OS 7)
      working-directory: android/SandorsReceiver
      run: ./gradlew assembleDebug

    - name: Build Pixel 10 Sender APK
      working-directory: android/SandorsSender
      run: ./gradlew assembleDebug

    - name: Upload Fire Stick Receiver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SandorsReceiver-debug
        path: android/SandorsReceiver/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Pixel Sender Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SandorsSender-debug
        path: android/SandorsSender/app/build/outputs/apk/debug/app-debug.apk
