name: Build Sandors Mirrorcast Apps (Debug Mode)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Debug - Inspect Workspace Tree
      run: |
        echo "=== WORKSPACE FILE TREE ==="
        find . -maxdepth 4 -not -path '*/.*' -not -path './node_modules*'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Debug - Verify Java Environment
      run: |
        echo "=== JAVA ENVIRONMENT ==="
        java -version
        javac -version
        echo "JAVA_HOME: $JAVA_HOME"

    - name: Auto-patch Sender Dependencies
      run: |
        set -x # Enable verbose tracing
        SENDER_GRADLE="extracted_files/android/SandorsSender/app/build.gradle"
        if [ -f "$SENDER_GRADLE" ]; then
          echo "Checking dependencies in $SENDER_GRADLE..."
          if ! grep -q "androidx.media:media" "$SENDER_GRADLE"; then
            echo "Injecting androidx.media dependency for VolumeProviderCompat..."
            sed -i '/dependencies {/a \    implementation "androidx.media:media:1.7.0"' "$SENDER_GRADLE"
          else
            echo "androidx.media dependency already present."
          fi
        else
          echo "ERROR: Sender build.gradle not found at $SENDER_GRADLE"
          exit 1
        fi

    - name: Debug - Inspect CastForegroundService.kt
      run: |
        SERVICE_FILE="extracted_files/android/SandorsSender/app/src/main/java/com/sandors/mirrorcast/sender/cast/CastForegroundService.kt"
        if [ -f "$SERVICE_FILE" ]; then
          echo "=== INSPECTING CastForegroundService.kt (Lines 70-105) ==="
          sed -n '70,105p' "$SERVICE_FILE"
        else
          echo "WARNING: CastForegroundService.kt not found at expected path."
          find extracted_files/android/SandorsSender -name "CastForegroundService.kt"
        fi

    - name: Grant execute permission for Gradle wrappers
      run: |
        set -x
        chmod +x extracted_files/android/SandorsReceiver/gradlew
        chmod +x extracted_files/android/SandorsSender/gradlew
        ls -la extracted_files/android/SandorsReceiver/gradlew
        ls -la extracted_files/android/SandorsSender/gradlew

    - name: Build Fire Stick Receiver APK (OS 7)
      working-directory: extracted_files/android/SandorsReceiver
      run: |
        echo "=== STARTING RECEIVER BUILD ==="
        ./gradlew assembleDebug --stacktrace --info || BUILD_FAILED=true
        if [ "$BUILD_FAILED" = true ]; then
          echo "❌ RECEIVER BUILD FAILED. Extracting error lines..."
          exit 1
        fi

    - name: Build Pixel 10 Sender APK
      working-directory: extracted_files/android/SandorsSender
      run: |
        echo "=== STARTING SENDER BUILD ==="
        ./gradlew assembleDebug --stacktrace --info || BUILD_FAILED=true
        if [ "$BUILD_FAILED" = true ]; then
          echo "❌ SENDER BUILD FAILED. Extracting error lines..."
          exit 1
        fi

    - name: Debug - Verify APK Outputs Exist
      run: |
        echo "=== CHECKING APK OUTPUTS ==="
        find extracted_files/android -name "*.apk" -ls

    - name: Upload Fire Stick Receiver Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SandorsPortalReceiver-debug
        path: extracted_files/android/SandorsReceiver/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Pixel Sender Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SandorsPortalSender-debug
        path: extracted_files/android/SandorsSender/app/build/outputs/apk/debug/app-debug.apk
