name: Build Android Apps with Clean Outcome Logs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-receiver:
    name: Build SandorsReceiver
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android 34 SDK Platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/SandorsReceiver/gradlew

      - name: Build and Generate Outcome Report
        working-directory: android/SandorsReceiver
        run: |
          mkdir -p ../../build-logs
          
          # Run gradle and capture raw output
          ./gradlew assembleDebug --no-daemon --stacktrace --info > gradle_output.tmp 2>&1
          BUILD_EXIT=$?

          # Clear out ALL old receiver log variants to ensure only one exists
          rm -f ../../build-logs/receiver-success.txt ../../build-logs/receiver-failure.txt

          if [ $BUILD_EXIT -eq 0 ]; then
            REPORT_PATH="../../build-logs/receiver-success.txt"
            STATUS_LABEL="SUCCESS"
          else
            REPORT_PATH="../../build-logs/receiver-failure.txt"
            STATUS_LABEL="FAILED (Exit Code: $BUILD_EXIT)"
          fi

          # Build the single fresh text report
          {
            echo "===================================================="
            echo " SANDORS RECEIVER - BUILD REPORT: $STATUS_LABEL"
            echo "===================================================="
            echo "Timestamp: $(date)"
            echo ""
            echo "----------------------------------------------------"
            echo " 1. SYSTEM & ENVIRONMENT INFORMATION"
            echo "----------------------------------------------------"
            uname -a
            java -version
            echo ""
            echo "ANDROID_HOME: $ANDROID_HOME"
            echo ""
            echo "----------------------------------------------------"
            echo " 2. GRADLE & KOTLIN COMPILER BUILD OUTPUT"
            echo "----------------------------------------------------"
            cat gradle_output.tmp
            echo ""
            echo "----------------------------------------------------"
            echo " 3. FINAL SUMMARY"
            echo "----------------------------------------------------"
            echo "Status: $STATUS_LABEL"
          } > "$REPORT_PATH"

          rm gradle_output.tmp
          exit $BUILD_EXIT

      - name: Upload Receiver APK Immediately
        uses: actions/upload-artifact@v4
        with:
          name: receiver-debug-apk
          path: android/SandorsReceiver/app/build/outputs/apk/debug/app-debug.apk

      - name: Sync Clean Logs to Repo Root
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add build-logs/
          git commit -m "chore: update latest receiver build report [skip ci]" || echo "No changes to commit"
          git push

  build-sender:
    name: Build SandorsSender
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android 35 SDK Platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/SandorsSender/gradlew

      - name: Build and Generate Outcome Report
        working-directory: android/SandorsSender
        run: |
          mkdir -p ../../build-logs
          
          ./gradlew assembleDebug --no-daemon --stacktrace --info > gradle_output.tmp 2>&1
          BUILD_EXIT=$?

          # Clear out ALL old sender log variants to ensure only one exists
          rm -f ../../build-logs/sender-success.txt ../../build-logs/sender-failure.txt

          if [ $BUILD_EXIT -eq 0 ]; then
            REPORT_PATH="../../build-logs/sender-success.txt"
            STATUS_LABEL="SUCCESS"
          else
            REPORT_PATH="../../build-logs/sender-failure.txt"
            STATUS_LABEL="FAILED (Exit Code: $BUILD_EXIT)"
          fi

          {
            echo "===================================================="
            echo " SANDORS SENDER - BUILD REPORT: $STATUS_LABEL"
            echo "===================================================="
            echo "Timestamp: $(date)"
            echo ""
            echo "----------------------------------------------------"
            echo " 1. SYSTEM & ENVIRONMENT INFORMATION"
            echo "----------------------------------------------------"
            uname -a
            java -version
            echo ""
            echo "ANDROID_HOME: $ANDROID_HOME"
            echo ""
            echo "----------------------------------------------------"
            echo " 2. GRADLE & KOTLIN COMPILER BUILD OUTPUT"
            echo "----------------------------------------------------"
            cat gradle_output.tmp
            echo ""
            echo "----------------------------------------------------"
            echo " 3. FINAL SUMMARY"
            echo "----------------------------------------------------"
            echo "Status: $STATUS_LABEL"
          } > "$REPORT_PATH"

          rm gradle_output.tmp
          exit $BUILD_EXIT

      - name: Upload Sender APK Immediately
        uses: actions/upload-artifact@v4
        with:
          name: sender-debug-apk
          path: android/SandorsSender/app/build/outputs/apk/debug/app-debug.apk

      - name: Sync Clean Logs to Repo Root
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add build-logs/
          git commit -m "chore: update latest sender build report [skip ci]" || echo "No changes to commit"
          git push
