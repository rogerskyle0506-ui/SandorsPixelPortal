name: Build Android Apps with Clean Outcome Logs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-receiver:
    name: Build SandorsReceiver
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android 34 SDK Platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/SandorsReceiver/gradlew

      - name: Build and Generate Outcome Report
        working-directory: android/SandorsReceiver
        run: |
          mkdir -p ../../build-logs
          REPORT_TEMP="../../build-logs/receiver-build-temp.txt"
          
          {
            echo "===================================================="
            echo " SANDORS RECEIVER - BUILD DIAGNOSTICS"
            echo "===================================================="
            echo "Timestamp: $(date)"
            echo ""
            echo "----------------------------------------------------"
            echo " 1. SYSTEM & ENVIRONMENT INFORMATION"
            echo "----------------------------------------------------"
            uname -a
            java -version
            echo ""
            echo "ANDROID_HOME: $ANDROID_HOME"
            echo ""
            echo "----------------------------------------------------"
            echo " 2. GRADLE & KOTLIN COMPILER BUILD OUTPUT"
            echo "----------------------------------------------------"
          } > "$REPORT_TEMP"

          ./gradlew assembleDebug --no-daemon --stacktrace --info >> "$REPORT_TEMP" 2>&1
          BUILD_EXIT=$?

          {
            echo ""
            echo "----------------------------------------------------"
            echo " 3. FINAL SUMMARY"
            echo "----------------------------------------------------"
            if [ $BUILD_EXIT -eq 0 ]; then
              echo "Status: SUCCESS"
            else
              echo "Status: FAILED (Exit Code: $BUILD_EXIT)"
            fi
          } >> "$REPORT_TEMP"

          rm -f ../../build-logs/receiver-success.txt ../../build-logs/receiver-failure.txt
          if [ $BUILD_EXIT -eq 0 ]; then
            mv "$REPORT_TEMP" ../../build-logs/receiver-success.txt
          else
            mv "$REPORT_TEMP" ../../build-logs/receiver-failure.txt
          fi

          exit $BUILD_EXIT

      - name: Upload Receiver APK Immediately
        uses: actions/upload-artifact@v4
        with:
          name: sandors-receiver-apk
          path: android/SandorsReceiver/app/build/outputs/apk/debug/app-debug.apk

      - name: Sync Clean Logs to Repo Root
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop || true
          git add build-logs/
          git commit -m "chore: update latest receiver build report [skip ci]" || echo "No changes to commit"
          git push origin main

  build-sender:
